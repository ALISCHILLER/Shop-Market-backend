name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:27-dind
        options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon

      - name: Build Docker image
        run: docker build -t eshop-backend:ci .