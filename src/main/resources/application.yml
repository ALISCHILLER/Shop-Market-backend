server:
  port: ${SERVER_PORT:8282}
  shutdown: graceful
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: eshop-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eshop}
    username: ${DB_USERNAME:eshop}
    password: ${DB_PASSWORD:eshop}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: eshop-backend
    version: 2.0.0
    stack: Spring Boot Kotlin Gradle PostgreSQL Flyway JWT

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${ESHOP_JWT_SECRET:change-me-to-a-very-long-secret-at-least-64-bytes-for-production}
    expiration-minutes: ${ESHOP_JWT_EXPIRATION_MINUTES:1440}
    auth:
      refresh-token-expiration-days: ${ESHOP_REFRESH_TOKEN_EXPIRATION_DAYS:30}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    invoice:
      tax-percent: ${ESHOP_TAX_PERCENT:9}

logging:
  level:
    root: INFO
    com.msa: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
