server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  flyway:
    locations:
      - classpath:db/migration/common
  jpa:
    properties:
      hibernate:
        format_sql: false