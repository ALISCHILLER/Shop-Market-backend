services:
  postgres:
    image: postgres:18-alpine
    container_name: eshop-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - eshop_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - eshop_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: eshop-backend:${APP_IMAGE_TAG:-latest}
    container_name: eshop-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,docker}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: 8282
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-600000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-1800000}
      DB_LEAK_DETECTION_THRESHOLD_MS: ${DB_LEAK_DETECTION_THRESHOLD_MS:-0}

      ESHOP_JWT_SECRET: ${ESHOP_JWT_SECRET:?ESHOP_JWT_SECRET is required}
      ESHOP_JWT_EXPIRATION_MINUTES: ${ESHOP_JWT_EXPIRATION_MINUTES:-60}
      ESHOP_REFRESH_TOKEN_EXPIRATION_DAYS: ${ESHOP_REFRESH_TOKEN_EXPIRATION_DAYS:-30}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      ESHOP_TRUST_FORWARDED_HEADERS: ${ESHOP_TRUST_FORWARDED_HEADERS:-true}
      ESHOP_TAX_PERCENT: ${ESHOP_TAX_PERCENT:-9}

      ESHOP_AUTH_RATE_LIMIT_ENABLED: ${ESHOP_AUTH_RATE_LIMIT_ENABLED:-true}
      ESHOP_AUTH_RATE_LIMIT_LOGIN_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_LOGIN_CAPACITY:-5}
      ESHOP_AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      ESHOP_AUTH_RATE_LIMIT_REFRESH_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_REFRESH_CAPACITY:-20}
      ESHOP_AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS:-60}
      ESHOP_AUTH_RATE_LIMIT_LOGOUT_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_LOGOUT_CAPACITY:-30}
      ESHOP_AUTH_RATE_LIMIT_LOGOUT_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_LOGOUT_WINDOW_SECONDS:-60}
      ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_CAPACITY:-3}
      ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_WINDOW_SECONDS:-300}

      ROOT_LOG_LEVEL: ${ROOT_LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-WARN}
    ports:
      - "${API_PORT:-8282}:8282"
    networks:
      - eshop_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8282/actuator/health/readiness | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

networks:
  eshop_internal:
    driver: bridge

volumes:
  eshop_postgres_prod_data: