services:
  postgres:
    image: postgres:18
    container_name: eshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eshop}
      POSTGRES_USER: ${POSTGRES_USER:-eshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eshop} -d ${POSTGRES_DB:-eshop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eshop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8282
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eshop}
      DB_USERNAME: ${POSTGRES_USER:-eshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eshop}
      ESHOP_JWT_SECRET: ${ESHOP_JWT_SECRET:?Set ESHOP_JWT_SECRET in .env before running docker compose}
      ESHOP_JWT_EXPIRATION_MINUTES: ${ESHOP_JWT_EXPIRATION_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${API_PORT:-8282}:8282"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8282/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  eshop_postgres_data:
