services:
  postgres:
    image: postgres:18-alpine
    container_name: eshop-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eshop}
      POSTGRES_USER: ${POSTGRES_USER:-eshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eshop_postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eshop} -d ${POSTGRES_DB:-eshop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eshop-api-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev,docker}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: 8282

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eshop}
      DB_USERNAME: ${POSTGRES_USER:-eshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eshop}

      ESHOP_JWT_SECRET: ${ESHOP_JWT_SECRET:?Set ESHOP_JWT_SECRET in .env before running docker compose}
      ESHOP_JWT_EXPIRATION_MINUTES: ${ESHOP_JWT_EXPIRATION_MINUTES:-1440}
      ESHOP_REFRESH_TOKEN_EXPIRATION_DAYS: ${ESHOP_REFRESH_TOKEN_EXPIRATION_DAYS:-30}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ESHOP_TRUST_FORWARDED_HEADERS: ${ESHOP_TRUST_FORWARDED_HEADERS:-false}
      ESHOP_TAX_PERCENT: ${ESHOP_TAX_PERCENT:-9}

      ESHOP_AUTH_RATE_LIMIT_ENABLED: ${ESHOP_AUTH_RATE_LIMIT_ENABLED:-true}
      ESHOP_AUTH_RATE_LIMIT_LOGIN_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_LOGIN_CAPACITY:-10}
      ESHOP_AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      ESHOP_AUTH_RATE_LIMIT_REFRESH_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_REFRESH_CAPACITY:-30}
      ESHOP_AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_REFRESH_WINDOW_SECONDS:-60}
      ESHOP_AUTH_RATE_LIMIT_LOGOUT_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_LOGOUT_CAPACITY:-60}
      ESHOP_AUTH_RATE_LIMIT_LOGOUT_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_LOGOUT_WINDOW_SECONDS:-60}
      ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_CAPACITY: ${ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_CAPACITY:-5}
      ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_WINDOW_SECONDS: ${ESHOP_AUTH_RATE_LIMIT_CHANGE_PASSWORD_WINDOW_SECONDS:-300}
    ports:
      - "${API_PORT:-8282}:8282"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8282/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  eshop_postgres_local_data: